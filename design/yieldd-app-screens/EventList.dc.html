<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --success:#4ED17F; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-display{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-0.01em;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;}
    .add-btn{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(244,176,0,0.32);}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:18px 20px 20px;}
    .group-label{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--slate);margin:0 2px 10px;}

    .event-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;}
    .event-card.live{border-color:rgba(244,176,0,0.45);box-shadow:0 10px 24px rgba(244,176,0,0.10);}
    .event-icon{width:44px;height:44px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .event-icon.live{background:var(--navy);}
    .event-mid{flex:1;min-width:0;}
    .event-name-row{display:flex;align-items:center;gap:8px;}
    .event-name{font-size:14.5px;font-weight:700;color:var(--navy);}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}
    .event-sub{font-size:12px;color:var(--slate);margin-top:2px;}
    .event-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
    .status-pill{font-size:10px;font-weight:700;padding:4px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:0.04em;}
    .status-live{background:rgba(244,176,0,0.16);color:#8A6100;}
    .status-upcoming{background:rgba(29,63,138,0.10);color:var(--blue);}
    .status-closed{background:var(--surface);color:var(--slate);}
    .lead-count{font-size:12px;font-weight:700;color:var(--navy);}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="t-display" style="color:var(--navy);">Events</div>
    <div class="add-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <div class="scroll">
    <div class="group-label">Live</div>
    <div class="event-card live">
      <div class="event-icon live">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </div>
      <div class="event-mid">
        <div class="event-name-row">
          <span class="event-name">IMTEX 2026</span>
          <div class="live-dot"></div>
        </div>
        <div class="event-sub">Bengaluru &middot; 18&ndash;22 Feb</div>
      </div>
      <div class="event-right">
        <span class="status-pill status-live">Live &middot; Day 3</span>
        <span class="lead-count">413 leads</span>
      </div>
    </div>

    <div class="group-label" style="margin-top:22px;">Upcoming</div>
    <div class="event-card">
      <div class="event-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </div>
      <div class="event-mid">
        <div class="event-name">Plastindia 2026</div>
        <div class="event-sub">Ahmedabad &middot; 4&ndash;9 Apr</div>
      </div>
      <div class="event-right">
        <span class="status-pill status-upcoming">Upcoming</span>
      </div>
    </div>

    <div class="group-label" style="margin-top:22px;">Closed</div>
    <div class="event-card">
      <div class="event-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </div>
      <div class="event-mid">
        <div class="event-name">Auto Expo 2025</div>
        <div class="event-sub">New Delhi &middot; 12&ndash;16 Nov</div>
      </div>
      <div class="event-right">
        <span class="status-pill status-closed">Closed</span>
        <span class="lead-count">286 leads</span>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
