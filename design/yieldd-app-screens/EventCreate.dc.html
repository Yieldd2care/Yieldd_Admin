<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --gold-hover:#FFC53D;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --placeholder:#97A3B8; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--gold);text-decoration:none;}
    .t-heading-lg{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}
    .t-body-sm{font-size:13px;line-height:1.4;font-weight:500;margin:0;}
    .t-caption{font-size:11px;letter-spacing:0.10em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;}
    .header-row{display:flex;align-items:center;gap:12px;}
    .back-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .progress-track{height:4px;border-radius:100px;background:var(--surface);margin-top:14px;overflow:hidden;}
    .progress-fill{height:100%;background:var(--gold);border-radius:100px;}
    .step-label{margin-top:6px;color:var(--slate);}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:24px 20px 20px;}
    .field{margin-bottom:18px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:8px;}
    .field input{width:100%;height:50px;border:1px solid var(--hairline);border-radius:var(--r-md);padding:0 16px;font-size:14.5px;font-family:'Inter',sans-serif;color:var(--navy);background:#fff;}
    .field input::placeholder{color:var(--placeholder);}
    .row-2{display:flex;gap:12px;}
    .row-2 .field{flex:1;}

    .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .chip{background:var(--surface);border-radius:100px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--navy);}

    .footer{flex:0 0 auto;padding:16px 20px 24px;background:#fff;border-top:1px solid var(--hairline);}
    .cta{width:100%;height:54px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(244,176,0,0.30);}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="header-row">
      <div class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="t-heading-lg" style="color:var(--navy);">Create your event</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:16.6%;"></div></div>
    <div class="t-caption step-label">Step 1 of 6</div>
  </div>

  <div class="scroll">
    <div class="field">
      <label>Event name</label>
      <input type="text" placeholder="e.g. IMTEX 2026" />
      <div class="chip-row">
        <span class="chip">IMTEX</span>
        <span class="chip">Plastindia</span>
        <span class="chip">Vibrant Gujarat</span>
        <span class="chip">Auto Expo</span>
        <span class="chip">IITF</span>
      </div>
    </div>
    <div class="field">
      <label>City</label>
      <input type="text" placeholder="e.g. Bengaluru" />
    </div>
    <div class="row-2">
      <div class="field">
        <label>Start date</label>
        <input type="text" placeholder="18 Feb 2026" />
      </div>
      <div class="field">
        <label>End date</label>
        <input type="text" placeholder="22 Feb 2026" />
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="cta">Continue</button>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
