<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --navy-elevated:#101C3E; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --success:#4ED17F; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}
    .t-caption{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;}
    .header-left{display:flex;align-items:center;gap:12px;}
    .back-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .refresh-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:18px 20px 24px;}

    .sync-row{display:flex;align-items:center;gap:6px;margin-bottom:14px;}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
    .sync-row span{font-size:11.5px;font-weight:700;color:var(--slate);}

    .stat-grid{display:flex;gap:12px;}
    .stat-box{flex:1;background:linear-gradient(155deg,var(--navy-elevated),var(--navy));border-radius:var(--r-lg);padding:16px;}
    .stat-box.light{background:#fff;border:1px solid var(--hairline);}
    .stat-num{font-size:26px;font-weight:800;color:#fff;letter-spacing:-0.01em;}
    .stat-box.light .stat-num{color:var(--navy);}
    .stat-label{font-size:11.5px;color:rgba(255,255,255,0.55);margin-top:3px;}
    .stat-box.light .stat-label{color:var(--slate);}

    .section-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--slate);margin:22px 0 12px;}

    .rate-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px;}
    .rate-bars{display:flex;align-items:flex-end;gap:6px;height:70px;}
    .rate-bar{flex:1;border-radius:4px 4px 0 0;background:var(--surface);}
    .rate-bar.peak{background:var(--gold);}
    .rate-labels{display:flex;justify-content:space-between;margin-top:8px;}
    .rate-labels span{font-size:9.5px;color:var(--slate);font-weight:600;}

    .leader-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;}
    .toggle-row{display:flex;align-items:center;gap:8px;}
    .toggle-row span{font-size:11px;font-weight:700;color:var(--slate);}
    .toggle{width:36px;height:22px;border-radius:100px;background:var(--gold);position:relative;}
    .toggle-knob{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;}

    .rep-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:6px 16px;}
    .rep-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--section);}
    .rep-row:last-child{border-bottom:none;}
    .rank{width:18px;font-size:12.5px;font-weight:800;color:var(--slate);}
    .rank.first{color:var(--gold);}
    .rep-avatar{width:32px;height:32px;border-radius:9px;background:var(--surface);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;}
    .rep-name{font-size:13px;font-weight:600;color:var(--navy);}
    .rep-count{margin-left:auto;font-size:13px;font-weight:700;color:var(--navy);}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="header-left">
      <div class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="t-heading-lg" style="color:var(--navy);">IMTEX 2026</div>
    </div>
    <div class="refresh-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
    </div>
  </div>

  <div class="scroll">
    <div class="sync-row">
      <div class="sync-dot"></div>
      <span>As of last sync &middot; 6 min ago</span>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-num">47</div>
        <div class="stat-label">Leads today</div>
      </div>
      <div class="stat-box light">
        <div class="stat-num">413</div>
        <div class="stat-label">Cumulative</div>
      </div>
    </div>

    <div class="section-label">Capture rate by hour</div>
    <div class="rate-card">
      <div class="rate-bars">
        <sc-for list="{{hourly}}" as="h" hint-placeholder-count="9">
          <div class="rate-bar {{h.peakClass}}" style="height:{{h.pct}}%;"></div>
        </sc-for>
      </div>
      <div class="rate-labels">
        <span>9am</span><span>11am</span><span>1pm</span><span>3pm</span><span>5pm</span>
      </div>
    </div>

    <div class="leader-head">
      <div class="section-label" style="margin:0;">Rep-wise leaderboard</div>
      <div class="toggle-row">
        <span>Visible to reps</span>
        <div class="toggle"><div class="toggle-knob"></div></div>
      </div>
    </div>
    <div class="rep-card">
      <sc-for list="{{reps}}" as="r" hint-placeholder-count="4">
        <div class="rep-row">
          <span class="rank {{r.rankClass}}">{{r.rank}}</span>
          <div class="rep-avatar">{{r.initial}}</div>
          <span class="rep-name">{{r.name}}</span>
          <span class="rep-count">{{r.count}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const pattern = [12, 28, 45, 62, 80, 100, 74, 58, 30];
    const hourly = pattern.map((pct) => ({ pct, peakClass: pct === 100 ? 'peak' : '' }));
    const reps = [
      { rank: '1', rankClass: 'first', initial: 'R', name: 'Rajesh Menon', count: 142 },
      { rank: '2', rankClass: '', initial: 'S', name: 'Sneha Kulkarni', count: 118 },
      { rank: '3', rankClass: '', initial: 'A', name: 'Amit Shah', count: 96 },
      { rank: '4', rankClass: '', initial: 'K', name: 'Kavita Rao', count: 57 },
    ];
    return { hourly, reps };
  }
}
</script>
</body>
</html>
