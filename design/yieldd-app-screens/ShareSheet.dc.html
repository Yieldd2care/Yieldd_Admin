<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --slate:#5A6B87; --hairline:#E3E7EF;
      --section:#F5F7FB; --surface:#EEF1F7;
      --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;display:flex;align-items:center;gap:12px;}
    .back-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

    .backdrop{flex:1 1 auto;position:relative;background:rgba(11,19,43,0.55);}
    .card-hint{position:absolute;top:24px;left:24px;right:24px;background:var(--navy);border-radius:16px;height:150px;opacity:0.35;}

    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:10px 20px 28px;box-shadow:0 -12px 30px rgba(11,19,43,0.20);}
    .grabber{width:36px;height:4px;border-radius:100px;background:var(--hairline);margin:0 auto 16px;}
    .sheet-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:16px;}

    .app-row{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px;}
    .app-item{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;width:60px;}
    .app-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
    .app-label{font-size:11px;font-weight:600;color:var(--navy);text-align:center;}

    .divider{height:1px;background:var(--hairline);margin:18px 0;}

    .action-row{display:flex;align-items:center;gap:14px;padding:12px 0;}
    .action-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;}
    .action-label{font-size:13.5px;font-weight:600;color:var(--navy);}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="t-heading-lg" style="color:var(--navy);">Your card</div>
  </div>

  <div class="backdrop">
    <div class="card-hint"></div>

    <div class="sheet">
      <div class="grabber"></div>
      <div class="sheet-title">Share your card</div>

      <div class="app-row">
        <div class="app-item">
          <div class="app-icon" style="background:#25D366;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
          </div>
          <div class="app-label">WhatsApp</div>
        </div>
        <div class="app-item">
          <div class="app-icon" style="background:var(--surface);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <div class="app-label">Messages</div>
        </div>
        <div class="app-item">
          <div class="app-icon" style="background:var(--surface);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
          </div>
          <div class="app-label">Email</div>
        </div>
        <div class="app-item">
          <div class="app-icon" style="background:var(--surface);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-4.3M8.2 13.2l7.6 4.3"/></svg>
          </div>
          <div class="app-label">More</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="action-row">
        <div class="action-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07L11 5"/><path d="M14 11a5 5 0 00-7.07 0L4.1 13.83a5 5 0 007.07 7.07L13 19"/></svg>
        </div>
        <div class="action-label">Copy link</div>
      </div>
      <div class="action-row">
        <div class="action-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
        </div>
        <div class="action-label">Save QR image</div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
