<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --success:#4ED17F; --danger:#C23B3B; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}

    .screen{width:390px;height:844px;position:relative;overflow:hidden;background:var(--section);}
    .backdrop{position:absolute;inset:0;background:rgba(11,19,43,0.55);}

    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 24px 30px;box-shadow:0 -20px 50px rgba(11,19,43,0.35);}
    .handle{width:36px;height:4px;border-radius:100px;background:var(--hairline);margin:0 auto 18px;}
    .lead-sub{font-size:12.5px;color:var(--slate);margin-top:5px;}

    .status-list{display:flex;flex-direction:column;gap:8px;margin-top:20px;}
    .status-row{display:flex;align-items:center;gap:12px;border:1.5px solid var(--hairline);border-radius:var(--r-md);padding:14px 16px;}
    .status-row.active{border-color:var(--gold);background:rgba(244,176,0,0.06);}
    .status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .status-label{font-size:14px;font-weight:700;color:var(--navy);flex:1;}
    .status-hint{font-size:11px;color:var(--slate);}
    .status-check{flex-shrink:0;}

    .won-note{display:flex;align-items:flex-start;gap:8px;background:rgba(244,176,0,0.08);border:1px solid rgba(244,176,0,0.30);border-radius:var(--r-md);padding:12px 14px;margin-top:16px;}
    .won-note span{font-size:12px;line-height:1.5;color:var(--navy);font-weight:500;}

    .cta{width:100%;height:54px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;}
  </style>
</helmet>

<div class="screen">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="handle"></div>
    <div class="t-heading-lg" style="color:var(--navy);">Change status</div>
    <div class="lead-sub">Rajesh Menon &middot; Northline Engineering</div>

    <div class="status-list">
      <div class="status-row">
        <div class="status-dot" style="background:#8A98B0;"></div>
        <span class="status-label">New</span>
      </div>
      <div class="status-row">
        <div class="status-dot" style="background:#1D3F8A;"></div>
        <span class="status-label">Contacted</span>
      </div>
      <div class="status-row active">
        <div class="status-dot" style="background:#F4B000;"></div>
        <span class="status-label">Qualified</span>
        <svg class="status-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="status-row">
        <div class="status-dot" style="background:#4ED17F;"></div>
        <span class="status-label">Won</span>
        <span class="status-hint">Asks for deal value</span>
      </div>
      <div class="status-row">
        <div class="status-dot" style="background:#C23B3B;"></div>
        <span class="status-label">Lost</span>
      </div>
    </div>

    <div class="won-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A6100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
      <span>Marking a lead Won opens a quick screen to enter the deal value &mdash; that's what turns cost-per-lead into real ROI.</span>
    </div>

    <button class="cta">
      Confirm
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
