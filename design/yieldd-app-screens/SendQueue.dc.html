<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --success:#4ED17F; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;}
    .cancel-link{font-size:13px;font-weight:700;color:var(--slate);}

    .progress-wrap{padding:20px 20px 0;}
    .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .progress-row span{font-size:12px;font-weight:700;color:var(--slate);}
    .progress-track{height:6px;border-radius:100px;background:var(--surface);overflow:hidden;}
    .progress-fill{height:100%;background:var(--gold);border-radius:100px;width:37.5%;}

    .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center;}
    .up-next-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--slate);}

    .lead-card{margin-top:16px;width:100%;background:#fff;border:1px solid var(--hairline);border-radius:20px;padding:28px 24px;}
    .lead-avatar{width:64px;height:64px;border-radius:18px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:0 auto;}
    .lead-name{margin-top:16px;font-size:17px;font-weight:700;color:var(--navy);}
    .lead-sub{font-size:12.5px;color:var(--slate);margin-top:2px;}

    .preview-bubble{margin-top:18px;background:var(--section);border-radius:10px;padding:12px 14px;text-align:left;font-size:12.5px;line-height:1.55;color:var(--navy);}

    .actions{display:flex;gap:10px;width:100%;margin-top:24px;}
    .btn-skip{flex:1;height:50px;border-radius:var(--r-md);background:#fff;border:1px solid var(--hairline);color:var(--navy);font-weight:700;font-size:14px;}
    .btn-send{flex:2;height:50px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:14.5px;border:none;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 20px rgba(244,176,0,0.28);}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="t-heading-lg" style="color:var(--navy);">Sending follow-ups</div>
    <a class="cancel-link" href="#">Cancel</a>
  </div>

  <div class="progress-wrap">
    <div class="progress-row">
      <span>3 of 8 sent</span>
      <span>5 remaining</span>
    </div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <div class="body">
    <div class="up-next-label">Up next</div>
    <div class="lead-card">
      <div class="lead-avatar">A</div>
      <div class="lead-name">Amit Shah</div>
      <div class="lead-sub">Prime Fabtech</div>
      <div class="preview-bubble">Hi Amit, great meeting you at IMTEX 2026. Sharing our brochure &mdash; let us know if you'd like a quote.</div>
    </div>

    <div class="actions">
      <button class="btn-skip">Skip</button>
      <button class="btn-send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        Open in WhatsApp
      </button>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
