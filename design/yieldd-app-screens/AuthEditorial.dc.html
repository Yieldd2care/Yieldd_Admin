<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --gold-hover:#FFC53D;
      --slate:#5A6B87; --placeholder:#97A3B8; --r-md:10px;
      --paper:#FFF9EE; --paper-line:rgba(11,19,43,0.14);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--navy);text-decoration:underline;text-underline-offset:2px;}
    .t-caption{font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;position:relative;}
    .scroll{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;}

    .mark{display:flex;align-items:center;gap:8px;padding:32px 32px 0;flex-shrink:0;}
    .mark-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
    .mark-word{font-size:13px;font-weight:800;letter-spacing:0.06em;color:var(--navy);}

    .hero{padding:28px 32px 0;flex-shrink:0;}
    .headline{font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-0.02em;color:var(--navy);text-wrap:balance;}
    .headline u{text-decoration-color:var(--gold);text-decoration-thickness:4px;text-underline-offset:5px;text-decoration-style:solid;}
    .pitch{margin-top:14px;font-size:15px;line-height:1.55;color:var(--slate);max-width:280px;}

    .tabrow{display:flex;gap:24px;padding:30px 32px 0;border-bottom:1px solid var(--paper-line);flex-shrink:0;}
    .tabword{font-size:14px;font-weight:700;color:var(--slate);padding-bottom:14px;}
    .tabword.active{color:var(--navy);border-bottom:2px solid var(--gold);margin-bottom:-1px;}

    .form{padding:26px 32px 0;display:flex;flex-direction:column;}
    .g-btn{height:50px;border:1px solid var(--paper-line);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:600;color:var(--navy);}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
    .divider .line{flex:1;height:1px;background:var(--paper-line);}
    .divider .word{font-size:10.5px;font-weight:700;letter-spacing:0.14em;color:var(--slate);}

    .fields{display:flex;flex-direction:column;gap:18px;}
    .field label{display:block;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);margin-bottom:8px;}
    .line-input{width:100%;border:none;border-bottom:1.5px solid var(--paper-line);background:transparent;padding:0 0 10px;font-size:16px;font-family:'Inter',sans-serif;color:var(--navy);}
    .line-input::placeholder{color:var(--placeholder);}

    .cta{width:100%;height:54px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;display:flex;align-items:center;justify-content:center;margin-top:28px;}

    .trust{margin-top:16px;font-size:12px;font-weight:600;color:var(--slate);}
    .trust b{color:var(--navy);}

    .footer{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:30px 32px 34px;margin-top:auto;}
    .footer a{font-size:11.5px;font-weight:600;color:var(--slate);}
  </style>
</helmet>

<div class="screen">
  <div class="scroll">
    <div class="mark">
      <div class="mark-dot"></div>
      <div class="mark-word">YIELDD</div>
    </div>

    <div class="hero">
      <h1 class="headline">Cards in.<br><u>Deals</u> out.</h1>
      <p class="pitch">Scan a card, type a walk-in or leave a voice note — Yieldd cleans it up and follows up the same day.</p>
    </div>

    <div class="tabrow">
      <div class="tabword active">Create account</div>
      <div class="tabword">Sign in</div>
    </div>

    <div class="form">
      <div class="g-btn">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </div>
      <div class="divider"><div class="line"></div><span class="word">OR</span><div class="line"></div></div>
      <div class="fields">
        <div class="field">
          <label>Full name</label>
          <input class="line-input" type="text" placeholder="Priya Sharma" />
        </div>
        <div class="field">
          <label>Company name</label>
          <input class="line-input" type="text" placeholder="Acme Industries Pvt Ltd" />
        </div>
        <div class="field">
          <label>Work email</label>
          <input class="line-input" type="text" placeholder="you@company.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input class="line-input" type="password" placeholder="At least 8 characters" />
        </div>
      </div>
      <button class="cta">Create account</button>
      <p class="trust"><b>Free to start.</b> No credit card needed.</p>
    </div>

    <div class="footer">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
