<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --blue:#1D3F8A; --gold:#F4B000;
      --r-md:10px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-display{font-size:27px;line-height:1.2;font-weight:800;letter-spacing:-0.01em;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--navy);overflow:hidden;position:relative;}
    .glow{position:absolute;pointer-events:none;width:480px;height:480px;border-radius:50%;background:var(--gold);opacity:0.10;top:-200px;left:50%;transform:translateX(-50%);}

    .body{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 36px;text-align:center;}

    .check-wrap{width:84px;height:84px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 36px rgba(244,176,0,0.38);}
    .name{margin-top:26px;color:#fff;}
    .sub{margin-top:8px;font-size:14px;color:rgba(255,255,255,0.60);font-weight:500;}

    .unlock-card{margin-top:30px;width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;text-align:left;}
    .unlock-row{display:flex;align-items:center;gap:10px;}
    .unlock-row span{font-size:13.5px;font-weight:600;color:#fff;}

    .receipt{margin-top:22px;font-size:12px;color:rgba(255,255,255,0.45);line-height:1.5;}
    .receipt a{color:var(--gold);font-weight:700;text-decoration:none;}

    .footer{position:relative;z-index:1;flex:0 0 auto;padding:0 32px 44px;}
    .cta{width:100%;height:56px;border-radius:100px;background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;box-shadow:0 12px 28px rgba(244,176,0,0.36);}
  </style>
</helmet>

<div class="screen">
  <div class="glow"></div>
  <div class="body">
    <div class="check-wrap">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="t-display name">You're on Pro</div>
    <div class="sub">&#8377;10,000 charged &middot; IMTEX 2026</div>

    <div class="unlock-card">
      <div class="unlock-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span>Unlimited leads unlocked</span>
      </div>
      <div class="unlock-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span>Follow-up pipeline unlocked</span>
      </div>
      <div class="unlock-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span>ROI dashboard unlocked</span>
      </div>
    </div>

    <div class="receipt">Receipt and GST invoice sent to your email &mdash; also in <a href="#">Settings &rsaquo; Billing</a>.</div>
  </div>

  <div class="footer">
    <button class="cta">Back to scanning</button>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
