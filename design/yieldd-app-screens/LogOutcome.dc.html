<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}
    .t-caption{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;position:relative;overflow:hidden;background:var(--section);}
    .backdrop{position:absolute;inset:0;background:rgba(11,19,43,0.55);}

    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 24px 30px;box-shadow:0 -20px 50px rgba(11,19,43,0.35);}
    .handle{width:36px;height:4px;border-radius:100px;background:var(--hairline);margin:0 auto 18px;}

    .lead-sub{font-size:12.5px;color:var(--slate);margin-top:5px;}

    .outcome-grid{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
    .outcome-card{display:flex;align-items:center;gap:12px;border:1.5px solid var(--hairline);border-radius:var(--r-md);padding:14px 16px;}
    .outcome-card.active{border-color:var(--gold);background:rgba(244,176,0,0.06);}
    .outcome-icon{width:36px;height:36px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .outcome-card.active .outcome-icon{background:var(--gold);}
    .outcome-label{font-size:13.5px;font-weight:700;color:var(--navy);}
    .outcome-check{margin-left:auto;}

    .note-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--slate);margin:22px 0 10px;}
    .note-area{border:1px solid var(--hairline);border-radius:var(--r-md);padding:14px;font-size:13.5px;color:var(--navy);min-height:64px;}

    .date-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
    .date-chip{border-radius:100px;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--navy);background:var(--surface);}
    .date-chip.active{background:var(--navy);color:#fff;}

    .cta{width:100%;height:54px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;margin-top:24px;}
  </style>
</helmet>

<div class="screen">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="handle"></div>
    <div class="t-heading-lg" style="color:var(--navy);">Log outcome</div>
    <div class="lead-sub">Rajesh Menon &middot; Northline Engineering</div>

    <div class="outcome-grid">
      <div class="outcome-card active">
        <div class="outcome-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.06 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.12.81.31 1.6.57 2.36a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.72-1.14a2 2 0 012.11-.45c.76.26 1.55.45 2.36.57A2 2 0 0122 16.92z"/></svg></div>
        <span class="outcome-label">Connected</span>
        <svg class="outcome-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="outcome-card">
        <div class="outcome-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 003.41 2.6l1.27-1.27a2 2 0 012.11-.45 12.7 12.7 0 002.81.53 2 2 0 011.72 2v3.5a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.06 4.18 2 2 0 014.11 2h3.5a2 2 0 012 1.72c.11.86.31 1.9.53 2.81a2 2 0 01-.45 2.11z"/><line x1="23" y1="1" x2="1" y2="23"/></svg></div>
        <span class="outcome-label">No answer</span>
      </div>
      <div class="outcome-card">
        <div class="outcome-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div>
        <span class="outcome-label">Not interested</span>
      </div>
      <div class="outcome-card">
        <div class="outcome-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="15" r="2"/></svg></div>
        <span class="outcome-label">Meeting set</span>
      </div>
    </div>

    <div class="note-label">Note (optional)</div>
    <div class="note-area">Confirmed they'll review the quote internally and revert by Friday.</div>

    <div class="note-label">Next follow-up</div>
    <div class="date-row">
      <div class="date-chip">Tomorrow</div>
      <div class="date-chip active">In 3 days</div>
      <div class="date-chip">Next week</div>
      <div class="date-chip">Custom</div>
    </div>

    <button class="cta">Save</button>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
