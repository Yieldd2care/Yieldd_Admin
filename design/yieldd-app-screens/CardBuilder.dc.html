<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --slate:#5A6B87; --hairline:#E3E7EF;
      --section:#F5F7FB; --surface:#EEF1F7; --placeholder:#97A3B8;
      --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}
    .t-body-sm{font-size:13px;line-height:1.4;font-weight:500;margin:0;}
    .t-caption{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;display:flex;align-items:center;gap:12px;}
    .back-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:22px 20px 20px;}

    .card-preview{background:var(--navy);border-radius:14px;padding:20px;position:relative;overflow:hidden;box-shadow:0 16px 30px rgba(11,19,43,0.22);}
    .cp-stripe{position:absolute;top:0;right:0;width:90px;height:90px;background:var(--gold);opacity:0.10;border-radius:0 0 0 100%;}
    .cp-avatar{width:46px;height:46px;border-radius:12px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;}
    .cp-name{margin-top:14px;font-size:17px;font-weight:700;color:#fff;}
    .cp-role{font-size:12.5px;color:rgba(255,255,255,0.65);margin-top:2px;}
    .cp-divider{height:1px;background:rgba(255,255,255,0.12);margin:14px 0;}
    .cp-contact{display:flex;gap:16px;}
    .cp-contact-item{display:flex;align-items:center;gap:6px;}
    .cp-contact-item span{font-size:11px;color:rgba(255,255,255,0.60);}

    .field{margin-top:20px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:8px;}
    .field input{width:100%;height:50px;border:1px solid var(--hairline);border-radius:var(--r-md);padding:0 16px;font-size:14.5px;font-family:'Inter',sans-serif;color:var(--navy);background:#fff;}
    .field input::placeholder{color:var(--placeholder);}
    .field.locked input{background:var(--surface);color:var(--slate);}

    .photo-row{display:flex;align-items:center;gap:14px;margin-top:22px;}
    .photo-circle{width:56px;height:56px;border-radius:50%;border:1.5px dashed var(--hairline);display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0;}
    .photo-text{font-size:13px;font-weight:600;color:var(--navy);}
    .photo-sub{font-size:11.5px;color:var(--slate);margin-top:2px;}

    .footer{flex:0 0 auto;padding:14px 20px 24px;background:#fff;border-top:1px solid var(--hairline);}
    .cta{width:100%;height:54px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(244,176,0,0.30);}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="t-heading-lg" style="color:var(--navy);">Build your card</div>
  </div>

  <div class="scroll">
    <div class="card-preview">
      <div class="cp-stripe"></div>
      <div class="cp-avatar">P</div>
      <div class="cp-name">Priya Sharma</div>
      <div class="cp-role">Sales Manager &middot; Acme Industries Pvt Ltd</div>
      <div class="cp-divider"></div>
      <div class="cp-contact">
        <div class="cp-contact-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.06 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.12.81.31 1.6.57 2.36a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.72-1.14a2 2 0 012.11-.45c.76.26 1.55.45 2.36.57A2 2 0 0122 16.92z"/></svg>
          <span>98204 41720</span>
        </div>
        <div class="cp-contact-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
          <span>priya@acme.in</span>
        </div>
      </div>
    </div>

    <div class="photo-row">
      <div class="photo-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#97A3B8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 012-2h2l1.4-2h5.2L16 6h2a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </div>
      <div>
        <div class="photo-text">Add a photo</div>
        <div class="photo-sub">Optional &mdash; helps people remember you</div>
      </div>
    </div>

    <div class="field locked">
      <label>Full name</label>
      <input type="text" value="Priya Sharma" readonly />
    </div>
    <div class="field locked">
      <label>Company</label>
      <input type="text" value="Acme Industries Pvt Ltd" readonly />
    </div>
    <div class="field">
      <label>Designation</label>
      <input type="text" placeholder="e.g. Sales Manager" />
    </div>
    <div class="field">
      <label>Mobile number</label>
      <input type="text" placeholder="98204 41720" />
    </div>
  </div>

  <div class="footer">
    <button class="cta">Save and preview</button>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
