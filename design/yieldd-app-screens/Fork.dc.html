<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --blue:#1D3F8A; --gold:#F4B000; --gold-hover:#FFC53D;
      --slate:#5A6B87; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-caption{font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--navy);overflow:hidden;position:relative;}
    .glow{position:absolute;pointer-events:none;width:520px;height:520px;border-radius:50%;background:var(--blue);opacity:0.16;top:-220px;left:50%;transform:translateX(-50%);}
    .glow2{position:absolute;pointer-events:none;width:280px;height:280px;border-radius:50%;background:var(--blue);opacity:0.16;top:-60px;left:50%;transform:translateX(-50%);}
    .scroll{position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;}

    .illo{display:flex;justify-content:center;padding:64px 32px 0;flex-shrink:0;}

    .hero{padding:34px 32px 0;flex-shrink:0;text-align:center;}
    .eyebrow{color:var(--gold);}
    .headline{margin-top:12px;font-size:26px;line-height:1.28;font-weight:800;letter-spacing:-0.01em;color:#fff;text-wrap:balance;}

    .cards{display:flex;flex-direction:column;gap:16px;padding:40px 24px 0;}
    .opt-card{background:#fff;border-radius:var(--r-lg);padding:20px;display:flex;align-items:flex-start;gap:14px;}
    .opt-icon{width:44px;height:44px;border-radius:var(--r-md);background:rgba(244,176,0,0.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .opt-body{flex:1;}
    .opt-title{font-size:16.5px;font-weight:700;color:var(--navy);}
    .opt-desc{font-size:13px;line-height:1.5;color:var(--slate);margin-top:8px;}
    .opt-chevron{flex-shrink:0;margin-top:4px;}
  </style>
</helmet>

<div class="screen">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="scroll">
    <div class="illo">
      <svg width="150" height="140" viewBox="0 0 160 150" fill="none">
        <rect x="62" y="10" width="36" height="14" rx="5" fill="#0B132B" stroke="rgba(255,255,255,0.40)" stroke-width="2"/>
        <rect x="40" y="20" width="80" height="112" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
        <rect x="54" y="42" width="16" height="16" rx="4" fill="#F4B000"/>
        <path d="M58 50l3 3 6-7" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="76" y="46" width="30" height="5" rx="2.5" fill="rgba(255,255,255,0.30)"/>
        <rect x="54" y="70" width="16" height="16" rx="4" fill="#F4B000"/>
        <path d="M58 78l3 3 6-7" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="76" y="74" width="30" height="5" rx="2.5" fill="rgba(255,255,255,0.30)"/>
        <rect x="54" y="98" width="16" height="16" rx="4" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
        <rect x="76" y="102" width="24" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>
        <line x1="98" y1="118" x2="128" y2="98" stroke="#F4B000" stroke-width="4" stroke-linecap="round"/>
        <circle cx="130" cy="96.5" r="3" fill="#F4B000"/>
      </svg>
    </div>

    <div class="hero">
      <div class="t-caption eyebrow">One quick question</div>
      <div class="headline">Setting this up for a team, or just yourself?</div>
    </div>

    <div class="cards">
      <div class="opt-card">
        <div class="opt-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
        <div class="opt-body">
          <div class="opt-title">For my team</div>
          <div class="opt-desc">Create an event, invite reps, and see live results across everyone.</div>
        </div>
        <svg class="opt-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#97A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div class="opt-card">
        <div class="opt-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        </div>
        <div class="opt-body">
          <div class="opt-title">Just me</div>
          <div class="opt-desc">Build your digital card and start capturing leads right away.</div>
        </div>
        <svg class="opt-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#97A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
