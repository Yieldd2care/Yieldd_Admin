<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --slate:#5A6B87; --hairline:#E3E7EF;
      --section:#F5F7FB; --surface:#EEF1F7; --placeholder:#97A3B8;
      --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}
    .t-body-sm{font-size:13px;line-height:1.5;font-weight:500;margin:0;}
    .t-caption{font-size:11px;letter-spacing:0.10em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;}
    .header-row{display:flex;align-items:center;gap:12px;}
    .back-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .progress-track{height:4px;border-radius:100px;background:var(--surface);margin-top:14px;overflow:hidden;}
    .progress-fill{height:100%;background:var(--gold);border-radius:100px;}
    .step-label{margin-top:6px;color:var(--slate);}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:20px 20px 20px;}
    .rep-row{display:flex;gap:10px;margin-bottom:12px;}
    .rep-row input{border:1px solid var(--hairline);border-radius:var(--r-md);height:50px;padding:0 14px;font-size:14px;font-family:'Inter',sans-serif;color:var(--navy);background:#fff;}
    .rep-row input::placeholder{color:var(--placeholder);}
    .rep-row .name{flex:1.3;}
    .rep-row .phone{flex:1;}
    .rep-remove{width:50px;height:50px;border-radius:var(--r-md);background:#fff;border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

    .add-row{display:flex;align-items:center;gap:8px;padding:12px 0;color:var(--gold);font-weight:700;font-size:13.5px;}

    .count-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:100px;padding:8px 14px;margin-top:8px;}
    .count-pill span{font-size:12.5px;font-weight:700;color:var(--navy);}

    .footer{flex:0 0 auto;padding:14px 20px 24px;background:#fff;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px;align-items:center;}
    .cta{width:100%;height:54px;border-radius:var(--r-md);background:#25D366;color:#fff;font-weight:700;font-size:15px;border:none;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 24px rgba(37,211,102,0.30);}
    .skip{color:var(--slate);font-size:13px;font-weight:600;}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="header-row">
      <div class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="t-heading-lg" style="color:var(--navy);">Bring your team in</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:50%;"></div></div>
    <div class="t-caption step-label">Step 3 of 6</div>
  </div>

  <div class="scroll">
    <div class="rep-row">
      <input class="name" type="text" value="Rajesh Menon" />
      <input class="phone" type="text" value="98204 41720" />
      <div class="rep-remove">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>
    <div class="rep-row">
      <input class="name" type="text" value="Sneha Kulkarni" />
      <input class="phone" type="text" value="90040 17733" />
      <div class="rep-remove">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>
    <div class="rep-row">
      <input class="name" type="text" placeholder="Full name" />
      <input class="phone" type="text" placeholder="Phone number" />
      <div class="rep-remove">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <div class="add-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4B000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add another
    </div>

    <div class="count-pill">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      <span>3 invites ready to send</span>
    </div>
  </div>

  <div class="footer">
    <button class="cta">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      Send invites via WhatsApp
    </button>
    <a href="#" class="skip">Skip for now</a>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
