<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --navy-elevated:#101C3E; --blue:#1D3F8A;
      --gold:#F4B000; --gold-hover:#FFC53D;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --label:#8A98B0; --ink-muted:#3C4C68; --success:#4ED17F; --placeholder:#97A3B8;
      --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--gold);text-decoration:none;}
    .t-display-lg{font-size:44px;line-height:1;font-weight:800;letter-spacing:-0.02em;margin:0;}
    .t-heading-md{font-size:17px;line-height:1.3;font-weight:600;margin:0;}
    .t-body-sm{font-size:13px;line-height:1.4;font-weight:500;margin:0;}
    .t-caption{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}

    .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0;}
    .avatar{width:34px;height:34px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;}
    .icon-btn{width:34px;height:34px;border-radius:var(--r-md);background:#fff;border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;}

    .scroll{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;}

    .offline-banner{display:flex;align-items:center;gap:12px;background:var(--navy-elevated);border-radius:var(--r-lg);margin:20px 20px 0;padding:14px 16px;}
    .offline-icon{width:34px;height:34px;border-radius:50%;background:rgba(78,209,127,0.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .offline-text{flex:1;}
    .offline-title{font-size:13.5px;font-weight:700;color:#fff;}
    .offline-sub{font-size:11.5px;color:rgba(255,255,255,0.55);margin-top:2px;}

    .hero{text-align:center;padding:40px 32px 0;}
    .hero-event{color:var(--slate);}
    .hero-num{margin-top:10px;color:var(--navy);}
    .hero-label{margin-top:4px;font-size:14.5px;color:var(--slate);}

    .entries{display:flex;gap:12px;padding:32px 20px 0;}
    .entry{flex:1;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;}
    .entry-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;}
    .entry-num{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-0.01em;}
    .entry-label{font-size:12.5px;color:var(--slate);margin-top:2px;}

    .fab-cluster{position:absolute;left:0;right:0;bottom:52px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;}
    .fab-main{width:68px;height:68px;border-radius:50%;background:var(--gold);box-shadow:0 14px 30px rgba(244,176,0,0.42);display:flex;align-items:center;justify-content:center;}
    .fab-secondary{font-size:11.5px;font-weight:700;color:var(--slate);}

    .tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--hairline);height:64px;position:relative;z-index:1;}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
    .tab-label{font-size:10.5px;font-weight:700;}
  </style>
</helmet>

<div class="screen">
  <div class="topbar">
    <div class="avatar">P</div>
    <div class="icon-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg>
    </div>
  </div>

  <div class="scroll">
    <div class="offline-banner">
      <div class="offline-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ED17F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a11 11 0 0114 0"/><path d="M8.5 16a6 6 0 017 0"/><circle cx="12" cy="19.5" r="1"/></svg>
      </div>
      <div class="offline-text">
        <div class="offline-title">Works fully offline</div>
        <div class="offline-sub">Nothing here needs signal &mdash; syncs when you're back</div>
      </div>
    </div>

    <div class="hero">
      <span class="t-caption hero-event">IMTEX 2026 &middot; B-42</span>
      <div class="t-display-lg hero-num">18</div>
      <div class="hero-label">leads captured today</div>
    </div>

    <div class="entries">
      <div class="entry">
        <div class="entry-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
        <div>
          <div class="entry-num">64</div>
          <div class="entry-label">Leads this event</div>
        </div>
      </div>
      <div class="entry">
        <div class="entry-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </div>
        <div>
          <div class="entry-num">7</div>
          <div class="entry-label">Follow-ups due</div>
        </div>
      </div>
    </div>
  </div>

  <div class="fab-cluster">
    <div class="fab-main">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 012-2h2l1.4-2h5.2L16 6h2a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </div>
    <a href="#" class="fab-secondary">Type it in instead</a>
  </div>

  <div class="tabbar">
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span class="tab-label" style="color:var(--navy);">Home</span>
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span class="tab-label" style="color:var(--slate);">Leads</span>
    </div>
    <div style="flex:1;"></div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      <span class="tab-label" style="color:var(--slate);">Events</span>
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      <span class="tab-label" style="color:var(--slate);">Profile</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
