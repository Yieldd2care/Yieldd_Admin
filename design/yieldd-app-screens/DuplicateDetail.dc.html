<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --label:#8A98B0; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}
    .t-body-sm{font-size:13px;line-height:1.5;font-weight:500;margin:0;}
    .t-caption{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;position:relative;overflow:hidden;background:var(--section);}
    .backdrop{position:absolute;inset:0;background:rgba(11,19,43,0.55);}
    .backdrop-card{position:absolute;top:64px;left:20px;right:20px;height:120px;background:#fff;border-radius:var(--r-lg);opacity:0.55;}

    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 24px 30px;box-shadow:0 -20px 50px rgba(11,19,43,0.35);}
    .handle{width:36px;height:4px;border-radius:100px;background:var(--hairline);margin:0 auto 20px;}

    .rep-row{display:flex;align-items:center;gap:12px;margin-top:6px;}
    .rep-avatar{width:44px;height:44px;border-radius:12px;background:var(--surface);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
    .rep-name{font-size:15px;font-weight:700;color:var(--navy);}
    .rep-sub{font-size:12px;color:var(--slate);margin-top:2px;}

    .note-card{background:var(--section);border-radius:var(--r-md);padding:16px;margin-top:18px;border-left:none;}
    .note-quote{color:var(--gold);font-size:22px;line-height:0.4;font-weight:800;display:block;margin-bottom:6px;}
    .note-text{font-size:14px;line-height:1.55;color:var(--navy);font-weight:500;}

    .actions{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
    .btn-primary{width:100%;height:52px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:15px;border:none;}
    .btn-secondary{width:100%;height:52px;border-radius:var(--r-md);background:#fff;border:1px solid var(--hairline);color:var(--navy);font-weight:700;font-size:15px;}
  </style>
</helmet>

<div class="screen">
  <div class="backdrop">
    <div class="backdrop-card"></div>
  </div>

  <div class="sheet">
    <div class="handle"></div>
    <div class="t-caption" style="color:var(--slate);">Already at this event</div>
    <div class="rep-row" style="margin-top:12px;">
      <div class="rep-avatar">A</div>
      <div>
        <div class="rep-name">Captured by Amit Shah</div>
        <div class="rep-sub">2 days ago &middot; Day 1, 3:40 PM</div>
      </div>
    </div>

    <div class="note-card">
      <span class="note-quote">&ldquo;</span>
      <div class="note-text">Northline is evaluating three vendors for their new plant line &mdash; wants a formal quote with lead times by next week.</div>
    </div>

    <div class="actions">
      <button class="btn-primary">Continue with new capture</button>
      <button class="btn-secondary">Merge into existing lead</button>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
