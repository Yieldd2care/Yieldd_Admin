<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --success:#4ED17F; --danger:#C23B3B;
      --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-display{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-0.01em;margin:0;}
    .t-caption{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;padding:18px 20px 20px;border-bottom:1px solid var(--hairline);}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:18px 20px 24px;}

    .profile-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px;}
    .profile-avatar{width:52px;height:52px;border-radius:14px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex-shrink:0;}
    .profile-name{font-size:15px;font-weight:700;color:var(--navy);}
    .profile-role{font-size:12px;color:var(--slate);margin-top:2px;}
    .profile-chevron{margin-left:auto;flex-shrink:0;}

    .plan-card{display:flex;align-items:center;gap:12px;background:linear-gradient(155deg,#101C3E,#0B132B);border-radius:var(--r-lg);padding:16px 18px;margin-top:14px;}
    .plan-badge{background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:100px;letter-spacing:0.04em;}
    .plan-text{flex:1;}
    .plan-title{font-size:13.5px;font-weight:700;color:#fff;}
    .plan-sub{font-size:11.5px;color:rgba(255,255,255,0.55);margin-top:2px;}

    .group{margin-top:22px;}
    .group-label{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--slate);margin-bottom:10px;padding:0 2px;}
    .group-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;}
    .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--section);}
    .row:last-child{border-bottom:none;}
    .row-icon{width:32px;height:32px;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .row-label{flex:1;font-size:13.5px;font-weight:600;color:var(--navy);}
    .row-meta{font-size:12px;color:var(--slate);font-weight:600;}
    .row-meta.success{color:#2E9C61;}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;margin-right:5px;}
    .sync-now{font-size:11.5px;font-weight:700;color:var(--gold);text-decoration:none;flex-shrink:0;}

    .toggle{width:40px;height:24px;border-radius:100px;background:var(--gold);position:relative;flex-shrink:0;}
    .toggle-knob{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;}

    .logout-row{margin-top:22px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:15px 16px;display:flex;align-items:center;gap:12px;}
    .logout-row span{font-size:13.5px;font-weight:700;color:var(--danger);}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="t-display" style="color:var(--navy);">Settings</div>
  </div>

  <div class="scroll">
    <div class="profile-card">
      <div class="profile-avatar">P</div>
      <div>
        <div class="profile-name">Priya Sharma</div>
        <div class="profile-role">Admin &middot; Acme Industries Pvt Ltd</div>
      </div>
      <div class="profile-chevron">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <div class="plan-card">
      <div class="plan-text">
        <div class="plan-title">Pro plan</div>
        <div class="plan-sub">Renews 12 Mar 2027</div>
      </div>
      <div class="plan-badge">ACTIVE</div>
    </div>

    <div class="group">
      <div class="group-label">Account</div>
      <div class="group-card">
        <div class="row">
          <div class="row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          </div>
          <div class="row-label">Team</div>
          <span class="row-meta">6 members</span>
        </div>
        <div class="row">
          <div class="row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 8h18M8 4v4"/></svg>
          </div>
          <div class="row-label">Plan &amp; billing</div>
        </div>
        <div class="row">
          <div class="row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          </div>
          <div class="row-label">GST invoices</div>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Preferences</div>
      <div class="group-card">
        <div class="row">
          <div class="row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg>
          </div>
          <div class="row-label">Notifications</div>
          <div class="toggle"><div class="toggle-knob"></div></div>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Sync &amp; storage</div>
      <div class="group-card">
        <div class="row">
          <div class="row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
          </div>
          <div class="row-label">Sync status</div>
          <span class="row-meta success" style="margin-right:10px;"><span class="sync-dot"></span>Synced</span>
          <a href="#" class="sync-now">Sync now</a>
        </div>
        <div class="row">
          <div class="row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
          </div>
          <div class="row-label">Storage used</div>
          <span class="row-meta">214 MB</span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Support</div>
      <div class="group-card">
        <div class="row">
          <div class="row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
          </div>
          <div class="row-label">Chat with support</div>
        </div>
      </div>
    </div>

    <div class="logout-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C23B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      <span>Log out</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
