<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --slate:#5A6B87; --hairline:#E3E7EF;
      --section:#F5F7FB; --surface:#EEF1F7; --placeholder:#97A3B8;
      --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}
    .t-body-sm{font-size:13px;line-height:1.5;font-weight:500;margin:0;}
    .t-caption{font-size:11px;letter-spacing:0.10em;text-transform:uppercase;font-weight:700;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;}
    .header-row{display:flex;align-items:center;gap:12px;}
    .back-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .progress-track{height:4px;border-radius:100px;background:var(--surface);margin-top:14px;overflow:hidden;}
    .progress-fill{height:100%;background:var(--gold);border-radius:100px;}
    .step-label{margin-top:6px;color:var(--slate);}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:20px 20px 20px;}
    .frame-line{color:var(--slate);margin:0 0 20px;line-height:1.55;}

    .total-card{background:var(--navy);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:20px;}
    .total-num{font-size:30px;font-weight:800;color:#fff;letter-spacing:-0.01em;}
    .total-label{font-size:12px;color:rgba(255,255,255,0.60);margin-top:4px;}

    .cost-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-md);padding:0 16px;height:52px;margin-bottom:12px;}
    .cost-label{flex:1;font-size:14px;font-weight:600;color:var(--navy);}
    .cost-input{width:120px;border:none;text-align:right;font-size:14.5px;font-family:'Inter',sans-serif;color:var(--navy);background:transparent;}
    .cost-input::placeholder{color:var(--placeholder);}
    .rupee{color:var(--slate);font-weight:600;font-size:14px;}

    .footer{flex:0 0 auto;padding:14px 20px 24px;background:#fff;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px;align-items:center;}
    .cta{width:100%;height:54px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(244,176,0,0.30);}
    .skip{color:var(--slate);font-size:13px;font-weight:600;}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="header-row">
      <div class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="t-heading-lg" style="color:var(--navy);">What did this cost?</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:33%;"></div></div>
    <div class="t-caption step-label">Step 2 of 6</div>
  </div>

  <div class="scroll">
    <p class="t-body-sm frame-line">This is the number the ROI dashboard is built on — add whatever you know now, adjust later.</p>

    <div class="total-card">
      <div class="total-num">&#8377;8,40,000</div>
      <div class="total-label">TOTAL EVENT COST</div>
    </div>

    <div class="cost-row"><span class="cost-label">Stall</span><span class="rupee">&#8377;</span><input class="cost-input" type="text" value="4,50,000" /></div>
    <div class="cost-row"><span class="cost-label">Fabrication</span><span class="rupee">&#8377;</span><input class="cost-input" type="text" value="1,80,000" /></div>
    <div class="cost-row"><span class="cost-label">Travel</span><span class="rupee">&#8377;</span><input class="cost-input" type="text" placeholder="0" /></div>
    <div class="cost-row"><span class="cost-label">Staff</span><span class="rupee">&#8377;</span><input class="cost-input" type="text" value="1,60,000" /></div>
    <div class="cost-row"><span class="cost-label">Marketing</span><span class="rupee">&#8377;</span><input class="cost-input" type="text" value="50,000" /></div>
  </div>

  <div class="footer">
    <button class="cta">Continue</button>
    <a href="#" class="skip">Skip for now</a>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
