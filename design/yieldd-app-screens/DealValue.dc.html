<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --success:#4ED17F; --placeholder:#97A3B8; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}

    .screen{width:390px;height:844px;position:relative;overflow:hidden;background:var(--section);}
    .backdrop{position:absolute;inset:0;background:rgba(11,19,43,0.55);}

    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 24px 30px;box-shadow:0 -20px 50px rgba(11,19,43,0.35);}
    .handle{width:36px;height:4px;border-radius:100px;background:var(--hairline);margin:0 auto 18px;}

    .won-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(78,209,127,0.14);color:#1F8A50;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:100px;margin-top:2px;}
    .lead-sub{font-size:12.5px;color:var(--slate);margin-top:12px;}

    .value-field{margin-top:22px;}
    .value-field label{display:block;font-size:12px;font-weight:700;letter-spacing:0.04em;color:var(--slate);text-transform:uppercase;margin-bottom:9px;}
    .value-input-wrap{display:flex;align-items:center;border:1.5px solid var(--gold);border-radius:14px;padding:0 18px;height:64px;box-shadow:0 0 0 3px rgba(244,176,0,0.14);}
    .rupee{font-size:22px;font-weight:700;color:var(--slate);margin-right:8px;}
    .value-input-wrap input{border:none;outline:none;font-size:26px;font-weight:800;color:var(--navy);width:100%;font-family:'Inter',sans-serif;}
    .value-input-wrap input::placeholder{color:var(--placeholder);}

    .field{margin-top:18px;}
    .field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:8px;}
    .field input{width:100%;height:48px;border:1px solid var(--hairline);border-radius:var(--r-md);padding:0 14px;font-size:14px;font-family:'Inter',sans-serif;color:var(--navy);background:#fff;}
    .field input::placeholder{color:var(--placeholder);}

    .actions{display:flex;gap:10px;margin-top:24px;}
    .btn-cancel{flex:1;height:52px;border-radius:var(--r-md);background:#fff;border:1px solid var(--hairline);color:var(--navy);font-weight:700;font-size:14px;}
    .btn-confirm{flex:2;height:52px;border-radius:var(--r-md);background:var(--gold);color:var(--navy);font-weight:700;font-size:15px;border:none;box-shadow:0 10px 24px rgba(244,176,0,0.28);}
  </style>
</helmet>

<div class="screen">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="handle"></div>
    <span class="won-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F8A50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      Marked Won
    </span>
    <div class="t-heading-lg" style="color:var(--navy);margin-top:10px;">What's the deal worth?</div>
    <div class="lead-sub">Rajesh Menon &middot; Northline Engineering</div>

    <div class="value-field">
      <label>Deal value</label>
      <div class="value-input-wrap">
        <span class="rupee">&#8377;</span>
        <input type="text" placeholder="0" value="4,20,000" />
      </div>
    </div>

    <div class="field">
      <label>Close date</label>
      <input type="text" placeholder="Optional" value="12 Mar 2026" />
    </div>
    <div class="field">
      <label>Note</label>
      <input type="text" placeholder="Optional" />
    </div>

    <div class="actions">
      <button class="btn-cancel">Cancel</button>
      <button class="btn-confirm">Confirm</button>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
