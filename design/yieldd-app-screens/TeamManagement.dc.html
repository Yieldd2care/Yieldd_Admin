<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --navy:#0B132B; --gold:#F4B000; --blue:#1D3F8A;
      --slate:#5A6B87; --hairline:#E3E7EF; --section:#F5F7FB; --surface:#EEF1F7;
      --success:#4ED17F; --danger:#C23B3B; --r-sm:6px; --r-md:10px; --r-lg:16px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .t-heading-lg{font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.01em;margin:0;}

    .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--section);overflow:hidden;position:relative;}
    .header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--hairline);padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;}
    .header-left{display:flex;align-items:center;gap:12px;}
    .back-btn{width:34px;height:34px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .invite-btn{background:var(--gold);color:var(--navy);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:100px;}

    .scroll{flex:1 1 auto;overflow-y:auto;padding:18px 20px 20px;}

    .seat-card{background:linear-gradient(155deg,#101C3E,#0B132B);border-radius:var(--r-lg);padding:16px 18px;}
    .seat-row{display:flex;align-items:center;justify-content:space-between;}
    .seat-title{font-size:13px;font-weight:700;color:#fff;}
    .seat-count{font-size:13px;font-weight:700;color:var(--gold);}
    .seat-track{height:6px;border-radius:100px;background:rgba(255,255,255,0.14);margin-top:10px;overflow:hidden;}
    .seat-fill{height:100%;background:var(--gold);border-radius:100px;}

    .section-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--slate);margin:22px 0 12px;}

    .member-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:6px 16px;}
    .member-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--section);}
    .member-row:last-child{border-bottom:none;}
    .member-avatar{width:36px;height:36px;border-radius:10px;background:var(--surface);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
    .member-mid{flex:1;min-width:0;}
    .member-name{font-size:13.5px;font-weight:700;color:var(--navy);}
    .member-role{font-size:11.5px;color:var(--slate);margin-top:1px;}
    .role-pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:100px;background:var(--surface);color:var(--navy);flex-shrink:0;}
    .role-pill.admin{background:rgba(244,176,0,0.16);color:#8A6100;}

    .invite-row{background:#fff;}
    .resend-link{font-size:11.5px;font-weight:700;color:var(--gold);flex-shrink:0;}
  </style>
</helmet>

<div class="screen">
  <div class="header">
    <div class="header-left">
      <div class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B132B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="t-heading-lg" style="color:var(--navy);">Team</div>
    </div>
    <div class="invite-btn">+ Invite</div>
  </div>

  <div class="scroll">
    <div class="seat-card">
      <div class="seat-row">
        <span class="seat-title">Seats used</span>
        <span class="seat-count">6 of 10</span>
      </div>
      <div class="seat-track"><div class="seat-fill" style="width:60%;"></div></div>
    </div>

    <div class="section-label">Active</div>
    <div class="member-card">
      <div class="member-row">
        <div class="member-avatar">P</div>
        <div class="member-mid">
          <div class="member-name">Priya Sharma</div>
          <div class="member-role">You</div>
        </div>
        <span class="role-pill admin">Admin</span>
      </div>
      <div class="member-row">
        <div class="member-avatar">R</div>
        <div class="member-mid">
          <div class="member-name">Rajesh Menon</div>
          <div class="member-role">142 leads captured</div>
        </div>
        <span class="role-pill">Rep</span>
      </div>
      <div class="member-row">
        <div class="member-avatar">S</div>
        <div class="member-mid">
          <div class="member-name">Sneha Kulkarni</div>
          <div class="member-role">118 leads captured</div>
        </div>
        <span class="role-pill">Rep</span>
      </div>
      <div class="member-row">
        <div class="member-avatar" style="opacity:0.5;">A</div>
        <div class="member-mid">
          <div class="member-name" style="color:var(--slate);">Amit Shah</div>
          <div class="member-role">Deactivated &middot; leads retained</div>
        </div>
      </div>
    </div>

    <div class="section-label">Pending invites</div>
    <div class="member-card invite-row">
      <div class="member-row">
        <div class="member-avatar" style="background:var(--section);color:var(--slate);">M</div>
        <div class="member-mid">
          <div class="member-name">Meera Iyer</div>
          <div class="member-role">Invited 2 days ago &middot; 98204 55210</div>
        </div>
        <a class="resend-link" href="#">Resend</a>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
