<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --navy:#0B132B; --blue:#1D3F8A; --gold:#F4B000; --gold-hover:#FFC53D;
    --r-md:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#333;overflow:hidden;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;}
  a{color:var(--gold);text-decoration:none;}
  .t-caption{font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;margin:0;}

  .screen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--navy);overflow:hidden;position:relative;}
  .glow{position:absolute;pointer-events:none;width:520px;height:520px;border-radius:50%;background:var(--blue);opacity:0.16;top:-220px;left:50%;transform:translateX(-50%);}
  .glow2{position:absolute;pointer-events:none;width:280px;height:280px;border-radius:50%;background:var(--blue);opacity:0.16;top:-60px;left:50%;transform:translateX(-50%);}
  .scroll{position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;}

  .hero{display:flex;flex-direction:column;align-items:center;padding:68px 32px 0;flex-shrink:0;}
  .lockup{width:130px;height:auto;filter:drop-shadow(0 20px 32px rgba(0,0,0,0.38));}

  .tabswitch{display:flex;gap:2px;background:rgba(255,255,255,0.08);border-radius:100px;padding:4px;margin:38px 32px 0;flex-shrink:0;}
  .tabseg{flex:1;text-align:center;padding:11px 4px;border-radius:100px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.65);cursor:pointer;}
  .tabseg.active{background:var(--gold);color:var(--navy);}

  .forgot{align-self:flex-end;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--gold);}

  .form{padding:24px 32px 0;display:flex;flex-direction:column;}
  .g-btn{height:52px;border-radius:100px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:600;color:var(--navy);}
  .divider{display:flex;align-items:center;gap:12px;margin:18px 0;}
  .divider .line{flex:1;height:1px;background:rgba(255,255,255,0.14);}
  .divider .word{font-size:10.5px;font-weight:700;letter-spacing:0.14em;color:rgba(255,255,255,0.50);}

  .fields{display:flex;flex-direction:column;gap:12px;}
  .pill-input{width:100%;height:52px;border-radius:100px;border:none;background:#fff;padding:0 22px;font-size:14.5px;font-family:'Inter',sans-serif;color:var(--navy);}
  .pill-input::placeholder{color:#97A3B8;}

  .cta{width:100%;height:56px;border-radius:100px;background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(244,176,0,0.36);margin-top:20px;}

  .footer{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:28px 32px 34px;margin-top:auto;}
  .foot-pill{background:rgba(255,255,255,0.08);border-radius:100px;padding:8px 16px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,0.85);text-decoration:underline;text-underline-offset:2px;}
  .foot-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.30);}
</style>
</head>
<body>
<div class="screen">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="scroll">
    <div class="hero">
      <img class="lockup" src="yieldd-lockup-transparent-sm.png" alt="Yieldd" />
    </div>

    <div class="tabswitch">
      <div class="tabseg">Create account</div>
      <div class="tabseg active">Sign in</div>
    </div>

    <div class="form">
      <div class="g-btn">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </div>
      <div class="divider"><div class="line"></div><span class="word">OR</span><div class="line"></div></div>
      <div class="fields">
        <input class="pill-input" type="text" placeholder="you@company.com" />
        <input class="pill-input" type="password" placeholder="At least 8 characters" />
      </div>
      <div class="forgot">Forgot password?</div>
      <button class="cta">Sign in</button>
    </div>

    <div class="footer">
      <a class="foot-pill" href="#">Privacy Policy</a>
      <div class="foot-dot"></div>
      <a class="foot-pill" href="#">Terms of Service</a>
    </div>
  </div>
</div>
</body>
</html>
