<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#3a3d44;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;height:620px;}
  .wrap{transform:rotate(-6.5deg) perspective(900px) rotateY(11deg) scale(0.82);filter:brightness(0.72) contrast(0.86) blur(0.7px);}
  .glare{position:absolute;left:18%;top:-10%;width:52%;height:130%;
         background:linear-gradient(105deg,rgba(255,255,255,0.42),rgba(255,255,255,0.02) 62%);
         transform:rotate(8deg);pointer-events:none;}
  .card{width:1050px;height:600px;background:#fdfdfb;box-sizing:border-box;padding:64px 72px;
        font-family:Georgia,'Times New Roman',serif;color:#1a1a1a;position:relative;}
  .bar{position:absolute;left:0;top:0;width:14px;height:100%;background:#8b1f2f;}
  .co{font-family:Helvetica,Arial,sans-serif;font-size:40px;font-weight:700;letter-spacing:1px;color:#8b1f2f;}
  .tag{font-family:Helvetica,Arial,sans-serif;font-size:17px;color:#666;letter-spacing:3px;margin-top:6px;}
  .name{font-size:44px;font-weight:700;margin-top:74px;}
  .desig{font-family:Helvetica,Arial,sans-serif;font-size:21px;color:#555;margin-top:8px;}
  .rows{font-family:Helvetica,Arial,sans-serif;font-size:19px;line-height:1.85;margin-top:44px;color:#333;}
  .k{display:inline-block;width:74px;color:#8b1f2f;font-weight:700;}
</style></head><body>

  <div class="rows">

    <div><span class="k">Office</span> 022 4915 8800</div>

    <div><span class="k">Web</span> www.northline.co.in</div>
    <div><span class="k">Works</span> Plot 47, MIDC Industrial Area, Andheri East, Mumbai 400093</div>
